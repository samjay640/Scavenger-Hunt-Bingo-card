<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Scavenger Hunt Bingo</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .no-print { @media print { display: none !important; } }
        .print-only { display: none; @media print { display: block !important; } }
        /* Animation for checking a box */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICON COMPONENTS (SVG) ---
        // Simplified SVG versions of Lucide icons for standalone portability
        const IconWrapper = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Icons = {
            Users: ({className}) => <IconWrapper className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconWrapper>,
            Flask: ({className}) => <IconWrapper className={className}><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></IconWrapper>,
            Medical: ({className}) => <IconWrapper className={className}><path d="M8 7a4 4 0 1 0 8 0"/><path d="M9 7v10a3 3 0 0 0 3 3h0a3 3 0 0 0 3-3V7"/><path d="M12 14v6"/><path d="M9 17h6"/></IconWrapper>, // Approximating briefcase/med kit
            Hand: ({className}) => <IconWrapper className={className}><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></IconWrapper>,
            Brain: ({className}) => <IconWrapper className={className}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></IconWrapper>,
            Footprints: ({className}) => <IconWrapper className={className}><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 11 3.8 11 8c0 1.25-1 2-1 3 0 2 0 3 2 4h1c1 0 2 1 2 2v2"/><path d="M8 22v-1"/><path d="M12 22v-1"/><path d="M16 22v-1"/></IconWrapper>, // Simplified foot
            Smartphone: ({className}) => <IconWrapper className={className}><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></IconWrapper>,
            Flame: ({className}) => <IconWrapper className={className}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></IconWrapper>,
            Baby: ({className}) => <IconWrapper className={className}><path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1"/></IconWrapper>,
            Activity: ({className}) => <IconWrapper className={className}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></IconWrapper>,
            Truck: ({className}) => <IconWrapper className={className}><path d="M10 17h4"/><path d="M5 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0"/><path d="M15 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0"/><path d="M15 17V8h-3V5h-2v3H4v8h1"/><path d="M20 17V11h-3v-3h3.5L22 11v6h-2"/></IconWrapper>,
            Skull: ({className}) => <IconWrapper className={className}><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><path d="M8 20v2h8v-2"/><path d="m12.5 17-.5-1-.5 1h1z"/><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/></IconWrapper>,
            HeartPulse: ({className}) => <IconWrapper className={className}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></IconWrapper>,
            Star: ({className}) => <IconWrapper className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconWrapper>,
            GraduationCap: ({className}) => <IconWrapper className={className}><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></IconWrapper>,
            Globe: ({className}) => <IconWrapper className={className}><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></IconWrapper>
        };

        // --- DATA ---
        const SCAVENGER_DATA = [
            { id: 1, shortTitle: "Triplet Anomalies", clue: "Three babies born at once, but nature played a tricky game...", target: "Multiple Congenital Anomalies in a Triplet Gestation", Icon: Icons.Users, color: "bg-pink-100 text-pink-700" },
            { id: 2, shortTitle: "SGLT2 & DKA", clue: "Sweet urine meds before the knife can lead to a dangerous state...", target: "Pre-operative SGLT2 inhibitors use and postoperative diabetic ketoacidosis", Icon: Icons.Flask, color: "bg-yellow-100 text-yellow-700" },
            { id: 3, shortTitle: "Happy Supervisor", clue: "Does a happy boss lead to a public health career? Find the Nigerian study...", target: "Probing the Link Between Supervisor Satisfaction...", Icon: Icons.Medical, color: "bg-green-100 text-green-700" },
            { id: 4, shortTitle: "Dupuytren’s in Kenya", clue: "Fingers curled tight in a Kenyan land. Seek the case report...", target: "Bilateral Dupuytren’s contracture in a Black Kenyan male", Icon: Icons.Hand, color: "bg-orange-100 text-orange-700" },
            { id: 5, shortTitle: "Hematoma Management", clue: "Old blood on the brain, resources are low. How does Cameroon manage...", target: "Management and Outcome of Chronic Subdural Hematoma...", Icon: Icons.Brain, color: "bg-red-100 text-red-700" },
            { id: 6, shortTitle: "Foot Positioning", clue: "In Nairobi's halls where students meet, someone is measuring...", target: "Assessment of Foot Positioning Among Medical Students...", Icon: Icons.Footprints, color: "bg-blue-100 text-blue-700" },
            { id: 7, shortTitle: "Social Media Body Image", clue: "Likes, shares, and the food on your plate. In Hohoe, find how...", target: "Exploring the influence of social media on dietary choices...", Icon: Icons.Smartphone, color: "bg-purple-100 text-purple-700" },
            { id: 8, shortTitle: "Burns in Uganda", clue: "From the village to the city, the fire burns the same...", target: "Burn Injuries in Uganda: Rural-Urban Disparities...", Icon: Icons.Flame, color: "bg-red-200 text-red-800" },
            { id: 9, shortTitle: "Pediatric TBI", clue: "A landscape of hurt heads, young and small. Find the analysis...", target: "Unveiling the Landscape of Pediatric Traumatic Brain Injuries...", Icon: Icons.Baby, color: "bg-teal-100 text-teal-700" },
            { id: 10, shortTitle: "Thyroid in Groin", clue: "Thyroid cancer usually stays near the neck... but find the strange path...", target: "An atypical metastatic pathway... papillary thyroid carcinoma", Icon: Icons.Activity, color: "bg-indigo-100 text-indigo-700" },
            { id: 11, shortTitle: "Drowsy Drivers", clue: "Eyes heavy on the road. Find the drivers in Ile-Ife who say...", target: "IF YOU SLEEP, YOU HAVE MISSED IT...", Icon: Icons.Truck, color: "bg-slate-200 text-slate-700" },
            { id: 12, shortTitle: "Skull Base Fractures", clue: "The bottom of the skull, a fracture so deep. In a Cameroonian center...", target: "NEUROEPIDEMIOLOGY AND MANAGEMENT OF SKULL BASE FRACTURES...", Icon: Icons.Skull, color: "bg-stone-200 text-stone-700" },
            { id: 13, shortTitle: "Heart Meds & Surgery", clue: "To stop the heart meds or let them flow? Before non-cardiac surgery...", target: "Discontinuation vs. Continuation of Renin-Angiotensin System Inhibitors...", Icon: Icons.HeartPulse, color: "bg-rose-100 text-rose-700" }
        ];

        const FILLERS = [
            { id: 99, shortTitle: "FREE SPACE", clue: "A free spot for the dedicated researcher.", target: "Bonus!", Icon: Icons.Star, color: "bg-yellow-300 text-yellow-800" },
            { id: 100, shortTitle: "PhD Goals", clue: "The ultimate destination.", target: "Future PhD Candidate", Icon: Icons.GraduationCap, color: "bg-blue-200 text-blue-900" },
            { id: 101, shortTitle: "Global Health", clue: "Connecting research across borders.", target: "Global Medical Impact", Icon: Icons.Globe, color: "bg-emerald-100 text-emerald-800" }
        ];

        // --- MAIN APP COMPONENT ---
        function BingoApp() {
            const [grid, setGrid] = useState([]);
            const [marked, setMarked] = useState([]);
            const [isPrintMode, setIsPrintMode] = useState(false);
            const [initialized, setInitialized] = useState(false);

            // Load state from localStorage on mount
            useEffect(() => {
                const savedGrid = localStorage.getItem('scavenger_grid');
                const savedMarked = localStorage.getItem('scavenger_marked');

                if (savedGrid) {
                    // We need to re-attach the Icon components because JSON.stringify strips functions
                    const parsedGrid = JSON.parse(savedGrid);
                    const hydratedGrid = parsedGrid.map(item => {
                        // Find original item to get the Icon component back
                        const original = [...SCAVENGER_DATA, ...FILLERS].find(o => o.id === item.id);
                        return { ...item, Icon: original ? original.Icon : Icons.Star };
                    });
                    setGrid(hydratedGrid);
                } else {
                    shuffleGrid();
                }

                if (savedMarked) {
                    setMarked(JSON.parse(savedMarked));
                } else {
                    setMarked([99]); // Free space
                }
                setInitialized(true);
            }, []);

            // Save state whenever it changes
            useEffect(() => {
                if (!initialized) return;
                
                // Save grid without the Icon component (circular structure)
                const gridToSave = grid.map(({ Icon, ...rest }) => rest);
                localStorage.setItem('scavenger_grid', JSON.stringify(gridToSave));
                localStorage.setItem('scavenger_marked', JSON.stringify(marked));
            }, [grid, marked, initialized]);

            const shuffleGrid = () => {
                const combined = [...SCAVENGER_DATA, ...FILLERS];
                // Fisher-Yates shuffle
                for (let i = combined.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [combined[i], combined[j]] = [combined[j], combined[i]];
                }
                setGrid(combined);
                setMarked([99]); // Reset marks but keep free space
            };

            const toggleMark = (id) => {
                if (marked.includes(id)) {
                    setMarked(marked.filter(m => m !== id));
                } else {
                    setMarked([...marked, id]);
                }
            };

            const resetGame = () => {
                if(confirm("Are you sure you want to reset your board and progress?")) {
                    shuffleGrid();
                }
            }

            if (!initialized) return <div className="p-10 text-center">Loading Scavenger Hunt...</div>;

            return (
                <div className={`min-h-screen font-sans ${isPrintMode ? 'bg-white p-0' : 'bg-slate-50 p-4 md:p-6'}`}>
                    
                    {/* Header / Controls */}
                    <div className={`max-w-4xl mx-auto mb-6 flex flex-col md:flex-row justify-between items-center gap-4 ${isPrintMode ? 'hidden' : ''}`}>
                        <div className="text-center md:text-left">
                            <h1 className="text-2xl md:text-3xl font-bold text-slate-800">Research Scavenger Hunt</h1>
                            <p className="text-slate-500 text-sm md:text-base">Find the paper, match the clue, mark the spot!</p>
                        </div>
                        <div className="flex flex-wrap justify-center gap-2">
                            <button 
                                onClick={resetGame}
                                className="px-3 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition shadow-sm text-sm font-medium flex items-center gap-2"
                            >
                                <Icons.Activity className="w-4 h-4" /> Reset / Shuffle
                            </button>
                            <button 
                                onClick={() => setIsPrintMode(!isPrintMode)}
                                className="px-3 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-900 transition shadow-md text-sm font-medium"
                            >
                                {isPrintMode ? "Exit Print Mode" : "Print View"}
                            </button>
                        </div>
                    </div>

                    {/* Print Header */}
                    {isPrintMode && (
                        <div className="text-center mb-6 border-b-2 border-slate-800 pb-4 pt-4">
                            <h1 className="text-4xl font-black text-slate-900 uppercase tracking-widest mb-2">Scavenger Bingo</h1>
                            <p className="text-slate-600 italic">Match the visual clue to the research paper title.</p>
                        </div>
                    )}

                    {/* Bingo Grid */}
                    <div className="max-w-4xl mx-auto">
                        <div className="grid grid-cols-4 gap-2 md:gap-4 mb-8 md:mb-12">
                            {grid.map((item) => {
                                const isMarked = marked.includes(item.id);
                                return (
                                    <div 
                                        key={item.id}
                                        onClick={() => !isPrintMode && toggleMark(item.id)}
                                        className={`
                                            aspect-square relative flex flex-col items-center justify-center p-1 md:p-2 text-center rounded-lg md:rounded-xl border-2 md:border-4 
                                            cursor-pointer transition-all duration-200 select-none
                                            ${isPrintMode ? 'border-slate-800 bg-white shadow-none' : 'shadow-sm active:scale-95'}
                                            ${!isPrintMode && isMarked ? 'bg-slate-800 border-slate-800' : `${item.color} border-white`}
                                        `}
                                    >
                                        {/* Checkmark overlay */}
                                        {!isPrintMode && isMarked && (
                                            <div className="absolute inset-0 flex items-center justify-center z-10 animate-pop">
                                                <div className="bg-white rounded-full p-1 md:p-2 shadow-lg">
                                                    <div className="w-6 h-6 md:w-8 md:h-8 rounded-full bg-green-500 flex items-center justify-center text-white font-bold text-sm md:text-xl">✓</div>
                                                </div>
                                            </div>
                                        )}

                                        <div className={`${!isPrintMode && isMarked ? 'opacity-20 blur-[1px]' : 'opacity-100'} flex flex-col items-center gap-1 md:gap-2 transition-opacity duration-300 h-full justify-center`}>
                                            <div className="transform scale-90 md:scale-125">
                                                <item.Icon className="w-6 h-6 md:w-8 md:h-8" />
                                            </div>
                                            <span className="text-[10px] md:text-sm font-bold leading-tight line-clamp-2 md:line-clamp-3">{item.shortTitle}</span>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {/* Clue List Reference */}
                        <div className="bg-white p-4 md:p-6 rounded-xl shadow-md border border-slate-200 break-inside-avoid">
                            <h2 className="text-lg md:text-xl font-bold mb-4 border-b pb-2 text-slate-800">Clue Key & Targets</h2>
                            <div className="grid md:grid-cols-2 gap-4 md:gap-6">
                                {SCAVENGER_DATA.map((item) => (
                                    <div key={item.id} className="flex gap-3 md:gap-4 items-start">
                                        <div className={`p-2 rounded-lg shrink-0 ${item.color} bg-opacity-20`}>
                                            <item.Icon className="w-5 h-5" />
                                        </div>
                                        <div>
                                            <p className="font-semibold text-xs md:text-sm text-slate-900 mb-1 leading-snug">{item.clue}</p>
                                            <p className="text-[10px] md:text-xs text-slate-500 italic">{item.target}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="mt-8 text-center text-xs text-slate-400 pb-8">
                            {isPrintMode ? "Generated for Academic Scavenger Hunt" : "Progress is saved automatically on this device."}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BingoApp />);
    </script>
</body>
</html>
